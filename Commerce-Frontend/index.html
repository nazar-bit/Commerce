<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WindFarm Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .layout { display: flex; gap: 20px; margin-top: 20px; }
        .panel { border: 1px solid #ccc; padding: 15px; width: 300px; background: #f9f9f9; }
        .item-btn { display: block; width: 100%; margin-bottom: 5px; padding: 8px; cursor: pointer; text-align: left; }
        .product-card { border: 1px solid #000; padding: 10px; margin-bottom: 10px; background: #fff; }

        /* Authentication Styles */
        #auth-bar { background: #eee; padding: 10px; display: flex; justify-content: space-between; border: 1px solid #ccc; align-items: center; }
        .auth-bar-left, .auth-bar-right { display: flex; gap: 10px; align-items: center; }
        
        #logged-out-view { display: flex; gap: 10px; }
        #logged-in-view { display: flex; gap: 10px; align-items: center; }

        .auth-form { 
            border: 1px solid #ccc; 
            padding: 20px; 
            background: #fff; 
            width: 300px; 
            position: absolute; 
            top: 60px; 
            display: none; 
            z-index: 1000;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        
        .form-right { right: 20px; }
        .form-left { left: 20px; }

        .auth-form button.close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: red;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            border-radius: 4px;
            margin: 0; 
        }

        .auth-form button.close-btn:hover {
            background: darkred;
        }

        /* Input Styles with Fake Placeholder */
        .input-container { position: relative; width: 90%; margin-bottom: 10px; }
        .input-container input, .input-container select, .input-container textarea { width: 100%; padding: 8px; box-sizing: border-box; margin: 0; font-family: inherit; }

        .fake-placeholder {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #757575; 
            font-size: 13.33px;
            pointer-events: none; 
        }

        .req-star { color: red; font-weight: bold; margin-left: 3px; }

        .input-container input:not(:placeholder-shown) ~ .fake-placeholder {
            display: none;
        }

        .select-star {
            position: absolute;
            right: 25px; 
            top: 50%;
            transform: translateY(-50%);
            color: red;
            font-weight: bold;
            pointer-events: none;
        }

        .auth-form button { width: 100%; padding: 8px; margin-top: 5px; }

        /* Maintainer-only top bar buttons */
        .maintainer-btn { display: none; padding: 8px 12px; cursor: pointer; }

        /* "Create Instances" */
        .instance-controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .instance-qty-input { width: 60px; padding: 6px; box-sizing: border-box; }
        .instance-add-btn {
            background: #28a745;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
            border-radius: 4px;
            cursor: pointer;
        }
        .instance-add-btn:hover { background: #218838; }
        .instance-msg { font-size: 12px; margin: 4px 0 0; min-height: 14px; }
    </style>
</head>
<body>

    <!-- Authentication Top Bar -->
    <div id="auth-bar">
        <!-- Top Left: Maintainer Controls -->
        <div class="auth-bar-left">
            <button id="add-product-btn" class="maintainer-btn" onclick="toggleForm('add-product-form')">Add Product</button>
            <button id="create-instances-btn" class="maintainer-btn" onclick="toggleCreateInstances()">Create Instances</button>
            <button id="create-category-btn" class="maintainer-btn" onclick="toggleForm('create-category-form')">Create Category</button>
        </div>

        <!-- Top Right: Auth Controls -->
        <div class="auth-bar-right">
            <div id="logged-out-view">
                <button onclick="toggleForm('login-form')">Sign In</button>
                <button onclick="toggleForm('register-form')">Register</button>
            </div>
            <div id="logged-in-view" style="display: none;">
                <span id="user-info"></span>
                <button onclick="logout()">Log Out</button>
            </div>
        </div>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="auth-form form-right">
        <button class="close-btn" onclick="toggleForm(null)">&times;</button>
        <h3>Sign In</h3>
        <div class="input-container">
            <input type="text" id="login-email" placeholder="Email">
        </div>
        <div class="input-container">
            <input type="password" id="login-password" placeholder="Password">
        </div>
        <button onclick="login()">Submit</button>
        <p id="login-msg" style="color:red; font-size: 12px;"></p>
    </div>

    <!-- Register Form -->
    <div id="register-form" class="auth-form form-right">
        <button class="close-btn" onclick="toggleForm(null)">&times;</button>
        <h3>Register</h3>
        <div class="input-container">
            <input type="text" id="reg-firstname" placeholder=" ">
            <span class="fake-placeholder">First Name<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <input type="text" id="reg-lastname" placeholder=" ">
            <span class="fake-placeholder">Last Name<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <input type="text" id="reg-phonenumber" placeholder="Phone Number">
        </div>
        <div class="input-container">
            <input type="text" id="reg-email" placeholder=" ">
            <span class="fake-placeholder">Email<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <input type="password" id="reg-password" placeholder=" ">
            <span class="fake-placeholder">Password<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <select id="reg-role">
                <option value="CUSTOMER">Customer</option>
                <option value="MAINTAINER">Maintainer</option>
            </select>
        </div>
        <button onclick="register()">Submit</button>
        <p id="reg-msg" style="color:red; font-size: 12px; white-space: pre-wrap;"></p>
    </div>

    <!-- Add Product Form (Maintainer only) -->
    <div id="add-product-form" class="auth-form form-left">
        <button class="close-btn" onclick="toggleForm(null)">&times;</button>
        <h3>Add Product</h3>
        <div class="input-container">
            <input type="text" id="add-product-name" placeholder=" ">
            <span class="fake-placeholder">Name<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <textarea id="add-product-description" placeholder="Description" rows="3" style="resize: vertical;"></textarea>
        </div>
        <div class="input-container">
            <input type="text" id="add-product-imageurl" placeholder="Image URL">
        </div>
        <div class="input-container">
            <input type="number" id="add-product-price" placeholder=" " min="0.01" step="0.01">
            <span class="fake-placeholder">Price<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <select id="add-product-category">
                <option value="">Select a category...</option>
            </select>
            <span class="select-star">*</span>
        </div>
        <button onclick="addProduct()">Submit</button>
        <p id="add-product-msg" style="color:red; font-size: 12px; white-space: pre-wrap;"></p>
    </div>

    <!-- Create Category Form (Maintainer only) -->
    <div id="create-category-form" class="auth-form form-left">
        <button class="close-btn" onclick="toggleForm(null)">&times;</button>
        <h3>Create Category</h3>
        <div class="input-container">
            <input type="text" id="create-category-name" placeholder=" ">
            <span class="fake-placeholder">Category Name<span class="req-star">*</span></span>
        </div>
        <div class="input-container">
            <select id="create-category-supername">
                <option value="">None (Top Level)</option>
            </select>
        </div>
        <button onclick="createCategory()">Submit</button>
        <p id="create-category-msg" style="color:red; font-size: 12px; white-space: pre-wrap;"></p>
    </div>

    <div class="layout">
        <div class="panel">
            <h3>Categories</h3>
            <button onclick="navigateToCategory(null)">Reset to Top Level</button>
            <hr>
            <div id="category-list"></div>
        </div>

        <div class="panel" style="width: 500px;">
            <h3 id="product-list-heading">Available Products</h3>
            <div id="product-list">
                Select a category to view products.
            </div>
        </div>
    </div>

    <script>
        let allCategories = [];
        let currentUser = null; 
        let currentCategoryId = null;
        let currentProducts = [];
        let creatingInstances = false;

        window.onload = function() {
            checkLocalSession();
            fetchCategories();
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('category') ? parseInt(urlParams.get('category')) : null;
            loadCategoryState(categoryId);
        };

        function fetchCategories() {
            fetch('http://localhost:8080/api/categories')
                .then(response => response.json())
                .then(data => {
                    allCategories = data;
                    populateCategoryDropdown();
                    populateSuperCategoryDropdown();
                    loadCategoryState(currentCategoryId);
                })
                .catch(error => console.error('Error fetching categories:', error));
        }

        function toggleForm(formId) {
            document.querySelectorAll('.auth-form').forEach(form => form.style.display = 'none');
            document.querySelectorAll('.auth-form p').forEach(p => p.innerText = '');
            document.querySelectorAll('.auth-form input').forEach(input => input.value = '');
            document.querySelectorAll('.auth-form select').forEach(select => select.selectedIndex = 0);
            document.querySelectorAll('.auth-form textarea').forEach(textarea => textarea.value = '');

            if (creatingInstances) {
                creatingInstances = false;
                const instancesBtn = document.getElementById('create-instances-btn');
                if (instancesBtn) instancesBtn.innerText = 'Create Instances';
                updateProductListHeading();
                if (currentCategoryId !== null) renderProducts();
            }

            if (formId) {
                const target = document.getElementById(formId);
                if (target) {
                    target.style.display = 'block';
                    
                    if (formId === 'add-product-form' || formId === 'create-category-form') {
                        fetchCategories();
                    }
                }
            }
        }

        function register() {
            const payload = {
                firstName: document.getElementById('reg-firstname').value.trim(),
                lastName: document.getElementById('reg-lastname').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                phoneNumber: document.getElementById('reg-phonenumber').value.trim(),
                password: document.getElementById('reg-password').value,
                role: document.getElementById('reg-role').value 
            };

            fetch('http://localhost:8080/api/accounts/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message);
                }
                return response.json();
            })
            .then(accountResponse => {
                setSession(accountResponse);
                toggleForm(null);
            })
            .catch(error => {
                document.getElementById('reg-msg').innerText = error.message;
            });
        }

        function login() {
            const payload = {
                email : document.getElementById('login-email').value.trim(),
                password : document.getElementById('login-password').value
            };

            fetch('http://localhost:8080/api/accounts/login', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message);
                }
                return response.json();
            })
            .then(accountResponse => {
                setSession(accountResponse);
                toggleForm(null);
            })
            .catch(error => {
                document.getElementById('login-msg').innerText = error.message;
            });
        }

        function setSession(accountData) {
            currentUser = accountData;
            localStorage.setItem('windfarm_user', JSON.stringify(accountData));
            updateAuthUI();
        }

        function checkLocalSession() {
            const savedUser = localStorage.getItem('windfarm_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                updateAuthUI();
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('windfarm_user');
            updateAuthUI();
        }

        function updateAuthUI() {
            const addProductBtn = document.getElementById('add-product-btn');
            const createCategoryBtn = document.getElementById('create-category-btn');
            const createInstancesBtn = document.getElementById('create-instances-btn');

            if (currentUser) {
                document.getElementById('logged-out-view').style.display = 'none';
                document.getElementById('logged-in-view').style.display = 'flex';
                document.getElementById('user-info').innerText = `Logged in as: ${currentUser.firstName || currentUser.email || 'User'}`;

                const isMaintainer = currentUser.role === 'MAINTAINER';
                if (addProductBtn) addProductBtn.style.display = isMaintainer ? 'inline-block' : 'none';
                if (createCategoryBtn) createCategoryBtn.style.display = isMaintainer ? 'inline-block' : 'none';
                if (createInstancesBtn) createInstancesBtn.style.display = isMaintainer ? 'inline-block' : 'none';
            } else {
                document.getElementById('logged-out-view').style.display = 'flex';
                document.getElementById('logged-in-view').style.display = 'none';

                if (addProductBtn) addProductBtn.style.display = 'none';
                if (createCategoryBtn) createCategoryBtn.style.display = 'none';
                if (createInstancesBtn) createInstancesBtn.style.display = 'none';

                creatingInstances = false;
                if (createInstancesBtn) createInstancesBtn.innerText = 'Create Instances';
                updateProductListHeading();
                if (currentCategoryId !== null) renderProducts();
            }
        }

        window.addEventListener('popstate', function(event) {
            const categoryId = event.state && event.state.id ? event.state.id : null;
            loadCategoryState(categoryId);
        });

        function loadCategoryState(categoryId) {
            renderCategories(categoryId);
            if (categoryId !== null) {
                fetchProducts(categoryId);
            } else {
                currentCategoryId = null;
                currentProducts = [];
                document.getElementById('product-list').innerHTML = 'Select a category to view products.';
            }
        }

        function navigateToCategory(categoryId) {
            const url = new URL(window.location);
            if (categoryId !== null) {
                url.searchParams.set('category', categoryId);
            } else {
                url.searchParams.delete('category');
            }
            window.history.pushState({ id: categoryId }, '', url);
            loadCategoryState(categoryId);
        }

        function renderCategories(parentId) {
            const container = document.getElementById('category-list');
            if(!container) return;
            container.innerHTML = ''; 

            const subcategories = allCategories.filter(cat => {
                return (cat.superId == null && parentId == null) || cat.superId === parentId;
            });

            if (subcategories.length === 0) {
                container.innerHTML = '<i>No subcategories available.</i>';
                return;
            }

            subcategories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'item-btn';
                btn.innerText = category.name;
                btn.onclick = () => navigateToCategory(category.id);
                container.appendChild(btn);
            });
        }

        function fetchProducts(categoryId) {
            currentCategoryId = categoryId;
            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = 'Loading...';

            fetch(`http://localhost:8080/api/products?categoryId=${categoryId}`)
                .then(response => response.json())
                .then(products => {
                    currentProducts = products || [];
                    renderProducts();
                })
                .catch(error => {
                    productContainer.innerHTML = 'Error loading products.';
                });
        }

        function renderProducts() {
            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = '';

            if (!currentProducts || currentProducts.length === 0) {
                productContainer.innerHTML = '<i>No products in this category.</i>';
                return;
            }

            currentProducts.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product-card';
                const currentStock = product.instanceCount || 0; 

                const instanceControls = creatingInstances ? `
                    <div class="instance-controls">
                        <input type="number" class="instance-qty-input" id="instance-qty-${product.id}" min="1" step="1" value="1">
                        <button class="instance-add-btn" onclick="addProductInstance(${product.id})" title="Add instance">+</button>
                    </div>
                    <p class="instance-msg" id="instance-msg-${product.id}"></p>
                ` : '';

                div.innerHTML = `
                    <h4>${product.name} <span style="font-size:12px; color:#555; background:#eee; padding:2px 6px; border-radius:4px; margin-left:8px;" id="stock-badge-${product.id}">Stock: ${currentStock}</span></h4>
                    <p>Price: $${product.price}</p>
                    <p>${product.description || ''}</p>
                    ${instanceControls}
                `;
                productContainer.appendChild(div);
            });
        }

        function toggleCreateInstances() {
            document.querySelectorAll('.auth-form').forEach(form => form.style.display = 'none');
            creatingInstances = !creatingInstances;
            const btn = document.getElementById('create-instances-btn');
            if (btn) btn.innerText = creatingInstances ? 'Exit Instance Mode' : 'Create Instances';
            updateProductListHeading();
            if (currentCategoryId !== null) {
                renderProducts();
            }
        }

        function updateProductListHeading() {
            const heading = document.getElementById('product-list-heading');
            if (heading) heading.innerText = creatingInstances ? 'Add Instances' : 'Available Products';
        }

        function addProductInstance(productId) {
            const qtyInput = document.getElementById(`instance-qty-${productId}`);
            const msgEl = document.getElementById(`instance-msg-${productId}`);
            const stockBadge = document.getElementById(`stock-badge-${productId}`);

            if (!qtyInput) return;

            const quantity = parseInt(qtyInput.value, 10) || 1;

            // Display processing state immediately
            if (msgEl) { 
                msgEl.style.color = 'blue'; 
                msgEl.innerText = 'Processing...'; 
            }

            const payload = {
                productId: productId,
                quantity: quantity
            };

            fetch(`http://localhost:8080/api/products/create/instances`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = `Server error: ${response.status}`;
                    try {
                        const errorData = JSON.parse(text);
                        errorMessage = errorData.message || errorMessage;
                    } catch (e) {}
                    throw new Error(errorMessage);
                }
                const text = await response.text();
                return text ? JSON.parse(text) : {};
            })
            .then(() => {
                const product = currentProducts.find(p => p.id === productId);
                if (product) {
                    product.instanceCount = (product.instanceCount || 0) + quantity;
                    if (stockBadge) {
                        stockBadge.innerText = `Stock: ${product.instanceCount}`;
                    }
                }
                if (msgEl) {
                    msgEl.style.color = 'green';
                    msgEl.innerText = `Added ${quantity} instance(s). Total is now ${product.instanceCount}.`;
                    setTimeout(() => {
                        if (msgEl.innerText.includes('Added')) {
                            msgEl.innerText = '';
                        }
                    }, 3000);
                }
            })
            .catch(error => {
                if (msgEl) {
                    msgEl.style.color = 'red';
                    msgEl.innerText = error.message;
                }
            });
        }

        function buildCategoryOptions(parentId, depth) {
            let options = [];
            const children = allCategories.filter(cat => {
                return (cat.superId == null && parentId == null) || cat.superId === parentId;
            });
            children.forEach(cat => {
                options.push({ id: cat.id, name: `${'-- '.repeat(depth)}${cat.name}` });
                options = options.concat(buildCategoryOptions(cat.id, depth + 1));
            });
            return options;
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('add-product-category');
            if (!select) return;
            select.innerHTML = '<option value="">Select a category...</option>';
            buildCategoryOptions(null, 0).forEach(opt => {
                const optionEl = document.createElement('option');
                optionEl.value = opt.id;
                optionEl.innerText = opt.name;
                select.appendChild(optionEl);
            });
        }

        function populateSuperCategoryDropdown() {
            const superSelect = document.getElementById('create-category-supername');
            if (!superSelect) return;
            superSelect.innerHTML = '<option value="">None (Top Level)</option>';
            buildCategoryOptions(null, 0).forEach(opt => {
                const rawCat = allCategories.find(c => c.id === opt.id);
                if (rawCat) {
                    const optionEl = document.createElement('option');
                    optionEl.value = rawCat.name; 
                    optionEl.innerText = opt.name;
                    superSelect.appendChild(optionEl);
                }
            });
        }

        function createCategory() {
            const name = document.getElementById('create-category-name').value.trim();
            const superCategoryName = document.getElementById('create-category-supername').value;

            const payload = {
                name: name,
                superCategoryName: superCategoryName === "" ? null : superCategoryName
            };

            fetch('http://localhost:8080/api/categories/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || "Failed to create category");
                }
                return response.json();
            })
            .then(() => {
                toggleForm(null);
                fetchCategories();
            })
            .catch(error => {
                document.getElementById('create-category-msg').innerText = error.message;
            });
        }

        function addProduct() {
            const payload = {
                name: document.getElementById('add-product-name').value,
                description: document.getElementById('add-product-description').value,
                imageUrl: document.getElementById('add-product-imageurl').value,
                price: parseFloat(document.getElementById('add-product-price').value) || 0,
                categoryId: parseInt(document.getElementById('add-product-category').value, 10) || null
            };

            fetch('http://localhost:8080/api/products/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message);
                }
                return response.json();
            })
            .then(createdProduct => {
                toggleForm(null);
                if (currentCategoryId !== null && createdProduct.categoryId === currentCategoryId) {
                    fetchProducts(currentCategoryId);
                }
            })
            .catch(error => {
                document.getElementById('add-product-msg').innerText = error.message;
            });
        }
    </script>
</body>
</html>
