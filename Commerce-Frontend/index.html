<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WindFarm Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; gap: 20px; padding: 20px; }
        .panel { border: 1px solid #ccc; padding: 15px; width: 300px; background: #f9f9f9; }
        .item-btn { display: block; width: 100%; margin-bottom: 5px; padding: 8px; cursor: pointer; text-align: left; }
        .product-card { border: 1px solid #000; padding: 10px; margin-bottom: 10px; background: #fff; }
    </style>
</head>
<body>

    <!-- Left Panel: Categories -->
    <div class="panel">
        <h3>Categories</h3>
        <button onclick="renderCategories(null)">Reset to Top Level</button>
        <hr>
        <div id="category-list">
            <!-- JavaScript will insert category buttons here -->
        </div>
    </div>

    <!-- Right Panel: Products -->
    <div class="panel" style="width: 500px;">
        <h3>Available Products</h3>
        <div id="product-list">
            Select a category to view products.
        </div>
    </div>

    <script>
        // Store all categories in memory so we don't have to fetch them on every click
        let allCategories = [];

        // 1. Fetch all categories when the page loads
        window.onload = function() {
            fetch('http://localhost:8080/api/categories')
                .then(response => response.json())
                .then(data => {
                    allCategories = data;
                    // Render the top-level categories (supercategoryId is null)
                    renderCategories(null);
                })
                .catch(error => console.error('Error fetching categories:', error));
        };

        // 2. Render categories based on the parent ID
        function renderCategories(parentId) {
            const container = document.getElementById('category-list');
            container.innerHTML = ''; // Clear existing categories

            // Find categories that match the requested parent ID
            const subcategories = allCategories.filter(cat => cat.superCategoryId === parentId);

            if (subcategories.length === 0) {
                container.innerHTML = '<i>No subcategories available.</i>';
                return;
            }

            // Create a button for each subcategory
            subcategories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'item-btn';
                btn.innerText = category.name;
                
                // When clicked, render its subcategories and fetch its products
                btn.onclick = function() {
                    renderCategories(category.id);
                    fetchProducts(category.id);
                };
                
                container.appendChild(btn);
            });
        }

        // 3. Fetch products for a specific category ID from the backend
        function fetchProducts(categoryId) {
            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = 'Loading...';

            fetch(`http://localhost:8080/api/products?categoryId=${categoryId}`)
                .then(response => response.json())
                .then(products => {
                    productContainer.innerHTML = ''; // Clear loading text

                    if (products.length === 0) {
                        productContainer.innerHTML = '<i>No products in this category.</i>';
                        return;
                    }

                    // Create a card for each product
                    products.forEach(product => {
                        const div = document.createElement('div');
                        div.className = 'product-card';
                        div.innerHTML = `
                            <h4>${product.name}</h4>
                            <p>Price: $${product.price}</p>
                            <p>${product.description || ''}</p>
                        `;
                        productContainer.appendChild(div);
                    });
                })
                .catch(error => {
                    productContainer.innerHTML = 'Error loading products.';
                    console.error(error);
                });
        }
    </script>

</body>
</html>
